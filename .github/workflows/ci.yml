name: Build

on:
  # Manual trigger for a deliberate rebuild/release.
  workflow_dispatch:
  push:
    branches: [main]
    # This package is huge (a ~700MB toolchain / ~528MB base), so a commit that
    # only touches CI plumbing must NOT trigger a rebuild -- it would mint a new
    # NVR nothing consumes. Spec or source changes still build; use
    # workflow_dispatch for a deliberate rebuild.
    paths-ignore:
      - '.github/**'
      - 'gemini-rtsw-ci'
      - '.gitmodules'
      - '**.md'
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        el: ['8', '9']
    uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/ci.yml@main
    with:
      scripts_dir: gemini-rtsw-ci
      el_version: ${{ matrix.el }}

  # Rebuild rpm-repo:latest ONCE, after both EL legs have pushed their scratch
  # tags. Single writer -> no el8/el9 race on :latest. Shows as the final job.
  publish:
    needs: build
    uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/publish.yml@main
    secrets: inherit
